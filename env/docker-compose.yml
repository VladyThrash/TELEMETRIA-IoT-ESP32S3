version: '3.8'

services:
  influxdb:
    image: influxdb:2.7
    container_name: influxdb_bio
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword
      - DOCKER_INFLUXDB_INIT_ORG=uv
      - DOCKER_INFLUXDB_INIT_BUCKET=biomecanica
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=token-secreto-biomecanica-2026
    volumes:
      - influxdb-data:/var/lib/influxdb2

  telegraf:
    image: telegraf:1.28
    container_name: telegraf_bio
    depends_on:
      - influxdb
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana_bio
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    depends_on:
      - influxdb
    volumes:
      - grafana-data:/var/lib/grafana

  postgres:
    image: postgres:16-alpine
    container_name: postgres_bio
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=terapia_pie
      - POSTGRES_USER=bio_user
      - POSTGRES_PASSWORD=bio_password_2026
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bio_user -d terapia_pie"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    container_name: webapp_bio
    ports:
      - "8501:8501"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=terapia_pie
      - DB_USER=bio_user
      - DB_PASSWORD=bio_password_2026
      - MQTT_BROKER=192.168.1.74
      - MQTT_PORT=1883
      - MQTT_TOPIC=telemetria/pie
      - MODEL_DIR=/app/models
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./webapp:/app
      - ml-models:/app/models

volumes:
  influxdb-data:
  grafana-data:
  postgres-data:
  ml-models: